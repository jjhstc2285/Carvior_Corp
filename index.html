<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>애니원모터스 통합 관리</title>

    <!--
      사내 시스템이라 검색에 안 잡히게 둔다. 다만 카톡·문자로 주소를 주고받아서
      미리보기(og:*)는 나와야 한다 — 링크만 덩그러니 뜨면 무슨 주소인지 모른다.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="애니원모터스 통합 관리 — 출퇴근·상담·정산·주차·매입" />

<!--
      탭 아이콘. 예전 마크(favicon.svg)를 지우고 회사 로고로 바꿨다.
      브라우저가 파비콘을 오래 붙들고 있어서 ?v= 를 붙였다 — 안 붙이면 새로고침해도
      한참 옛 아이콘이 남는다. 로고를 또 바꾸면 이 숫자를 올린다.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />

    <!-- 홈 화면에 추가했을 때 쓰는 아이콘·이름 (브라우저 앱처럼 쓰는 분들이 많다) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="애니원모터스" />

    <!-- 카톡·메신저로 주소를 보냈을 때 뜨는 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="애니원모터스" />
    <meta property="og:title" content="애니원모터스 통합 관리" />
    <meta property="og:description" content="출퇴근·상담·정산·주차·매입을 한 곳에서 봅니다." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
