# Apache 가상호스트 — biz.carvior.store (80포트)
#
# carvior.store 상자에 서브도메인으로 올린다. 그 상자에는 이미 네 개가 돌고 있다
# (carvior-web · chavata-admin · chavata-api · classify-api) — 포트와 디스크를
# 먼저 확인할 것. deploy/README-biz.md 의 체크리스트를 보고 시작한다.
#
# 설치:
#   sudo cp deploy/apache-biz.conf /etc/apache2/sites-available/biz-carvior.conf
#   sudo a2enmod rewrite proxy proxy_http proxy_wstunnel headers
#   sudo a2ensite biz-carvior
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# 그 다음 인증서:
#   sudo certbot --apache -d biz.carvior.store
#   sudo cp deploy/apache-biz-ssl.conf /etc/apache2/sites-available/biz-carvior-le-ssl.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# ⚠ certbot이 만든 443 설정에는 socket.io 프록시가 없다. 실제 접속은 https라
# 그걸 안 덮으면 실시간 알림이 조용히 롱폴링으로만 돈다 — apache-biz-ssl.conf 로 덮을 것.

<VirtualHost *:80>
    ServerName biz.carvior.store

    # 프론트엔드 — Vite로 빌드한 정적 파일
    DocumentRoot /var/www/carvior-biz

    <Directory /var/www/carvior-biz>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA 라우팅 — 없는 경로로 새로고침해도 index.html을 돌려준다.
        # 이게 없으면 새로고침할 때마다 404가 난다.
        FallbackResource /index.html
    </Directory>

    # 해시가 붙은 번들은 오래 캐시하고, index.html은 캐시하지 않는다
    # (index.html이 캐시되면 배포해도 사용자가 옛 화면을 계속 본다)
    <Directory /var/www/carvior-biz/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>
    <Files "sw.js">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    # 업로드된 파일은 **S3**로 간다(server/src/storage/storage.service.ts) — Apache가 내줄 것이 없다.
    # 아래 Alias는 AWS 키 없이 띄웠을 때의 로컬 폴백만을 위한 것이다. 운영에서는 비어 있다.
    Alias /uploads /var/www/carvior-biz-uploads
    <Directory /var/www/carvior-biz-uploads>
        Options -Indexes
        Require all granted
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # 백엔드 API — pm2 carvior-biz-api.
    #
    # ⚠ 포트 3100이다. 애니원 설정은 3000이었는데 carvior 상자에서는 Next.js(carvior-web)가
    # 3000을 쓸 가능성이 높아서 비켜 세웠다. server/.env 의 PORT와 **반드시 같아야 한다**.
    # 올리기 전에 `sudo ss -ltnp | grep 3100` 으로 비어 있는지 확인할 것.
    #
    # localhost 대신 127.0.0.1을 쓴다: localhost는 IPv6(::1)로 먼저 붙으려다
    # Node가 IPv4만 듣고 있으면 연결이 실패하는 경우가 있다.
    ProxyPreserveHost On

    # 실시간 알림·메시지(socket.io) — 업그레이드 요청을 /api 규칙보다 **먼저** 넘긴다.
    # 이 블록이 없으면 업그레이드 요청이 FallbackResource로 떨어져 index.html(200)이
    # 돌아오고, 브라우저 콘솔에 "Unexpected response code: 200"이 계속 찍힌다.
    # socket.io는 HTTP 롱폴링으로 붙었다가 WebSocket으로 올라가므로 두 줄이 다 필요하다.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3100/socket.io/$1 [P,L]
    ProxyPass /socket.io http://127.0.0.1:3100/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3100/socket.io

    ProxyPass /api http://127.0.0.1:3100/api
    ProxyPassReverse /api http://127.0.0.1:3100/api

    # 클라이언트 실제 IP 전달 — 출근 등록 IP 화이트리스트가 이 값을 쓴다
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/carvior-biz-error.log
    CustomLog ${APACHE_LOG_DIR}/carvior-biz-access.log combined
</VirtualHost>
