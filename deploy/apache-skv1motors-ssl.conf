# Apache 가상호스트 (HTTPS) — skv1motors.com
#
# certbot이 만들어 준 443 설정에 socket.io 프록시·캐시 규칙을 더한 것.
# 실제 운영에 올라가 있는 내용을 그대로 남겨둔다 — certbot이 파일을 다시 만들거나
# 서버를 새로 세우면 이 내용이 사라져서, 실시간 알림이 조용히 롱폴링으로만 돌게 된다.
#
# 인증서 발급(최초 1회):
#   sudo certbot --apache -d skv1motors.com -d www.skv1motors.com
#
# 그 뒤 이 파일로 덮어쓴다:
#   sudo cp deploy/apache-skv1motors-ssl.conf /etc/apache2/sites-available/skv1motors-le-ssl.conf
#   sudo a2enmod rewrite proxy proxy_http proxy_wstunnel headers
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# 인증서 경로(SSLCertificateFile/KeyFile)는 certbot이 만든 값과 같아야 한다.
# 80포트 설정은 apache-skv1motors.conf 에 따로 있다(certbot이 https로 리다이렉트를 넣어준다).

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName skv1motors.com
    ServerAlias www.skv1motors.com

    # 프론트엔드 — Vite로 빌드한 정적 파일
    DocumentRoot /var/www/skv1motors

    <Directory /var/www/skv1motors>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA 라우팅 — 없는 경로로 새로고침해도 index.html을 돌려준다.
        # 이게 없으면 새로고침할 때마다 404가 난다.
        FallbackResource /index.html
    </Directory>

    # 해시가 붙은 번들 파일은 오래 캐시하고, index.html은 캐시하지 않는다.
    # (index.html이 캐시되면 배포해도 사용자가 옛날 화면을 계속 본다)
    <Directory /var/www/skv1motors/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>
    # 푸시 알림용 서비스워커도 같은 이유로 캐시하지 않는다.
    <Files "sw.js">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    # 업로드된 매물 사진 — Node를 거치지 않고 Apache가 직접 서빙(더 빠름)
    Alias /uploads /var/www/skv1motors-uploads
    <Directory /var/www/skv1motors-uploads>
        Options -Indexes
        Require all granted
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # 백엔드 API — pm2로 띄운 NestJS(127.0.0.1:3000)로 넘긴다.
    # localhost 대신 127.0.0.1을 쓴다: localhost는 IPv6(::1)로 먼저 붙으려다
    # Node가 IPv4만 듣고 있으면 연결이 실패하는 경우가 있다.
    ProxyPreserveHost On

    # 실시간 알림·메시지(socket.io) — WebSocket 업그레이드 요청을 먼저 넘긴다.
    # /api 규칙보다 위에 있어야 하고, proxy_wstunnel 모듈이 필요하다.
    # 이 블록이 없으면 업그레이드 요청이 FallbackResource로 떨어져 index.html(200)이
    # 돌아오고, 브라우저 콘솔에 "Unexpected response code: 200"이 계속 찍힌다.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3000/socket.io/$1 [P,L]

    ProxyPass /socket.io http://127.0.0.1:3000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3000/socket.io

    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # 클라이언트 실제 IP 전달 — 출근 등록 IP 화이트리스트가 이 값을 쓴다.
    # 80포트 설정과 달리 여기는 https다(복사하면서 http로 두기 쉬운 자리).
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/skv1motors-error.log
    CustomLog ${APACHE_LOG_DIR}/skv1motors-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/skv1motors.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/skv1motors.com/privkey.pem
</VirtualHost>
</IfModule>
