# Apache 가상호스트 (HTTPS) — biz.carvior.store
#
# certbot이 만들어 준 443 설정에 socket.io 프록시·캐시 규칙을 더한 것.
# certbot이 파일을 다시 만들거나 서버를 새로 세우면 이 내용이 사라져서,
# 실시간 알림이 조용히 롱폴링으로만 돌게 된다 — 그래서 레포에 남겨둔다.
#
# 인증서 발급(최초 1회):
#   sudo certbot --apache -d biz.carvior.store
#
# 그 뒤 이 파일로 덮어쓴다:
#   sudo cp deploy/apache-biz-ssl.conf /etc/apache2/sites-available/biz-carvior-le-ssl.conf
#   sudo a2enmod rewrite proxy proxy_http proxy_wstunnel headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# 인증서 경로는 certbot이 만든 값과 같아야 한다. carvior.store 와일드카드 인증서가
# 이미 있으면 그 경로를 써도 된다 — *.carvior.store 는 biz.carvior.store 를 덮는다.
# (단 anyone.biz.carvior.store 같은 두 단계는 못 덮는다. 와일드카드는 한 단계다)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName biz.carvior.store

    DocumentRoot /var/www/carvior-biz

    <Directory /var/www/carvior-biz>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Directory /var/www/carvior-biz/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>
    <Files "sw.js">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    Alias /uploads /var/www/carvior-biz-uploads
    <Directory /var/www/carvior-biz-uploads>
        Options -Indexes
        Require all granted
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # ⚠ 포트 3100 — server/.env 의 PORT와 같아야 한다. 80포트 설정의 주석 참고.
    ProxyPreserveHost On

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3100/socket.io/$1 [P,L]
    ProxyPass /socket.io http://127.0.0.1:3100/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3100/socket.io

    ProxyPass /api http://127.0.0.1:3100/api
    ProxyPassReverse /api http://127.0.0.1:3100/api

    # 80포트 설정과 달리 여기는 https다(복사하면서 http로 두기 쉬운 자리)
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/carvior-biz-error.log
    CustomLog ${APACHE_LOG_DIR}/carvior-biz-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/biz.carvior.store/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/biz.carvior.store/privkey.pem
</VirtualHost>
</IfModule>
